<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>אלפון ע״ז</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אלפון ע״ז">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;height:100%;background:#f2f2f7;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#f2f2f7}
</style>
</head>
<body>
<iframe id="app" allow="clipboard-write" title="אלפון ע״ז"></iframe>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbwEKqe7aNq8KHnBsHeU00vnsN30P__pFegUhAl6AOfB9iRUuUvBetfRGiIjy1HJyGCf/exec';
  var K = 'alfonAZ_wrap', st = {};
  function idb(cb) {
    try {
      var r = indexedDB.open('alfonAZ', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { cb(r.result); };
      r.onerror = function () { cb(null); };
    } catch (x) { cb(null); }
  }
  function cacheGet(cb) {
    idb(function (db) {
      if (!db) return cb(null);
      try { var q = db.transaction('kv').objectStore('kv').get('cache'); q.onsuccess = function () { cb(q.result || null); }; q.onerror = function () { cb(null); }; }
      catch (x) { cb(null); }
    });
  }
  function cachePut(o) {
    cacheGet(function (c) {
      if (!c || c.t !== o.t) c = { t: o.t };
      if (o.d) c.d = o.d;
      if (o.ph) { c.ph = o.ph; c.phts = o.phts || 0; }
      idb(function (db) { if (!db) return; try { db.transaction('kv', 'readwrite').objectStore('kv').put(c, 'cache'); } catch (x) {} });
    });
  }
  function cacheClear() { idb(function (db) { if (!db) return; try { db.transaction('kv', 'readwrite').objectStore('kv').delete('cache'); } catch (x) {} }); }
  try { st = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) { st = {}; }
  var q = [];
  if (st.t) q.push('t=' + encodeURIComponent(st.t));
  if (st.s) q.push('s=' + encodeURIComponent(JSON.stringify(st.s)));
  var pwa = (window.navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (pwa) q.push('pwa=1');
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); deferred = ev; });
  var cm = (location.search.match(/[?&]card=([^&#]+)/) || [])[1];
  if (cm) {
    document.title = 'כרטיס – אלפון ע״ז';
    document.getElementById('app').src = EXEC + '?w=1&card=' + encodeURIComponent(decodeURIComponent(cm));
    return;
  }
  document.getElementById('app').src = EXEC + (q.length ? '?' + q.join('&') : '');
  window.addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (x) { return; }
    if (!/(\.googleusercontent\.com|^script\.google\.com)$/.test(host)) return;
    if (e.data && ('alfonAZ_get' in e.data)) {
      var src = e.source, org = e.origin, tok = String(e.data.alfonAZ_get || '');
      cacheGet(function (c) { try { src.postMessage({ alfonAZ_cache: (c && tok && c.t === tok) ? c : null }, org); } catch (x) {} });
      return;
    }
    if (e.data && e.data.alfonAZ_put) { cachePut(e.data.alfonAZ_put); return; }
    if (e.data && e.data.alfonAZ_install) { if (deferred) { deferred.prompt(); deferred = null; } return; }
    var d = e.data && e.data.alfonAZ;
    if (!d) return;
    st = { t: String(d.t || ''), s: d.s || null };
    if (!st.t) cacheClear();
    try { localStorage.setItem(K, JSON.stringify(st)); } catch (x) {}
  });
})();
</script>
</body>
</html>
