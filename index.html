<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>אלפון ע״ז</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אלפון ע״ז">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
html,body{margin:0;height:100%;background:#f2f2f7;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#f2f2f7}
</style>
</head>
<body>
<iframe id="app" allow="clipboard-write" title="אלפון ע״ז"></iframe>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzYtzQDud3Uc_zHINYIFxNNTZYtKRwrapP5sjy5AMHCvu4KyDJvTco1-VIF8V5trdok/exec';
  var K = 'alfonAZ_wrap', st = {};
  try { st = JSON.parse(localStorage.getItem(K) || '{}') || {}; } catch (e) { st = {}; }
  var q = [];
  if (st.t) q.push('t=' + encodeURIComponent(st.t));
  if (st.s) q.push('s=' + encodeURIComponent(JSON.stringify(st.s)));
  var pwa = (window.navigator.standalone === true) || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  if (pwa) q.push('pwa=1');
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); deferred = ev; });
  document.getElementById('app').src = EXEC + (q.length ? '?' + q.join('&') : '');
  window.addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (x) { return; }
    if (!/(\.googleusercontent\.com|^script\.google\.com)$/.test(host)) return;
    if (e.data && e.data.alfonAZ_install) { if (deferred) { deferred.prompt(); deferred = null; } return; }
    var d = e.data && e.data.alfonAZ;
    if (!d) return;
    st = { t: String(d.t || ''), s: d.s || null };
    try { localStorage.setItem(K, JSON.stringify(st)); } catch (x) {}
  });
})();
</script>
</body>
</html>
